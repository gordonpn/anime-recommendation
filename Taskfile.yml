version: '3'

tasks:
  build:
    desc: Build the Spring Boot application jar
    cmds:
      - ./gradlew clean bootJar

  run:
    desc: Run the packaged CLI application
    cmds:
      - java -jar build/libs/anime-0.0.1-SNAPSHOT.jar

  start:
    desc: Build and run the CLI application
    cmds:
      - task: build
      - task: run

  test:
    desc: Run the unit and integration tests
    cmds:
      - ./gradlew test
