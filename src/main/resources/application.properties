mal.callback.port=8081
mal.client.id=${MAL_CLIENT_ID:dummy-client-id}
mal.client.secret=${MAL_CLIENT_SECRET:dummy-client-secret}
mal.redirect.uri=http://127.0.0.1:8081/callback
server.shutdown=graceful
spring.application.name=recommendation
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${user.dir}/anime.db
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repeatable-sql-migration-prefix=R
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-separator=__
spring.flyway.sql-migration-suffixes=.sql
spring.jackson.serialization.indent_output=true
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.profiles.active=dev
spring.shell.interactive.enabled=true
spring.shell.command.script.enabled=false
spring.shell.command.history.enabled=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
app.mode=cli
recommendation.weights.occurrence=1.0
recommendation.weights.rating=0.5
recommendation.weights.popularity=0.0001