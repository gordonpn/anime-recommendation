name: coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  test-coverage:
    name: runner / coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Set up JDK 25 (toolchain target)
        id: setup-java-25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up JDK 21 (Gradle daemon)
        id: setup-java-21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Gradle Environment
        run: |
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=${{ steps.setup-java-21.outputs.path }} -Dorg.gradle.java.installations.paths=${{ steps.setup-java-25.outputs.path }}" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        env:
          MAL_CLIENT_ID: dummy-client-id
          MAL_CLIENT_SECRET: dummy-client-secret
        run: task test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          slug: ${{ github.repository }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
