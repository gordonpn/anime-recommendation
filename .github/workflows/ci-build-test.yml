name: "CI: Build & Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Set up JDK 25 (toolchain target)
        id: setup-java-25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up JDK 21 (Gradle daemon)
        id: setup-java-21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Gradle Environment
        run: |
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=${{ steps.setup-java-21.outputs.path }} -Dorg.gradle.java.installations.paths=${{ steps.setup-java-25.outputs.path }}" >> "$GITHUB_ENV"

      - name: Execute Tests via Taskfile
        run: task test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
