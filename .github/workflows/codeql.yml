name: codeql

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: runner / codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Set up JDK 25 (toolchain target)
        id: setup-java-25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up JDK 21 (Gradle daemon)
        id: setup-java-21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Gradle Environment
        run: |
          echo "GRADLE_OPTS=-Dorg.gradle.java.home=${{ steps.setup-java-21.outputs.path }} -Dorg.gradle.java.installations.paths=${{ steps.setup-java-25.outputs.path }}" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Java application
        env:
          MAL_CLIENT_ID: dummy-client-id
          MAL_CLIENT_SECRET: dummy-client-secret
        run: task build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
